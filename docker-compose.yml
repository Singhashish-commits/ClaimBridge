version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  eureka-server:
    build: ./Eureka-Server
    container_name: eureka-server
    ports:
      - "${EUREKA_PORT}:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./Gateway
    container_name: ${GATEWAY_NAME}
    ports:
      - "${GATEWAY_PORT}:8765"
    depends_on:
      eureka-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_APPLICATION_NAME=${GATEWAY_NAME}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_SERVER_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - EUREKA_INSTANCE_HOSTNAME=${GATEWAY_NAME}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_DISCOVERY_LOCATOR_ENABLED=true
      - SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_DISCOVERY_LOCATOR_LOWER_CASE_SERVICE_ID=true

  auth-service:
    build: ./Auth-Service
    container_name: ${AUTH_NAME}
    ports:
      - "${AUTH_SERVICE_PORT}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_APPLICATION_NAME=${AUTH_NAME}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${AUTH_DB}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_SERVER_URL}
      - EUREKA_INSTANCE_HOSTNAME=${AUTH_NAME}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false

  patient-service:
    build: ./Patient-Service
    container_name: ${PATIENT_NAME}
    ports:
      - "${PATIENT_SERVICE_PORT}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_APPLICATION_NAME=${PATIENT_NAME}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${PATIENT_DB}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_SERVER_URL}
      - EUREKA_INSTANCE_HOSTNAME=${PATIENT_NAME}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false

  prescription-service:
    build: ./Prescription-Service
    container_name: ${PRESCRIPTION_NAME}
    ports:
      - "${PRESCRIPTION_SERVICE_PORT}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_APPLICATION_NAME=${PRESCRIPTION_NAME}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${PRESCRIPTION_DB}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_SERVER_URL}
      - EUREKA_INSTANCE_HOSTNAME=${PRESCRIPTION_NAME}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false

  claims-service:
    build: ./Claim-Service
    container_name: ${CLAIM_NAME}
    ports:
      - "${CLAIM_SERVICE_PORT}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_APPLICATION_NAME=${CLAIM_NAME}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${CLAIM_DB}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_SERVER_URL}
      - EUREKA_INSTANCE_HOSTNAME=${CLAIM_NAME}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false

  fraud-service:
    build: ./Fraud-Service
    container_name: ${FRAUD_NAME}
    ports:
      - "${FRAUD_SERVICE_PORT}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_APPLICATION_NAME=${FRAUD_NAME}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${FRAUD_DB}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_SERVER_URL}
      - EUREKA_INSTANCE_HOSTNAME=${FRAUD_NAME}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false

  notification-service:
    build: ./Notification-Service
    container_name: ${NOTIFICATION_NAME}
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:8086"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_APPLICATION_NAME=${NOTIFICATION_NAME}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${NOTIFICATION_DB}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_SERVER_URL}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - EUREKA_INSTANCE_HOSTNAME=${NOTIFICATION_NAME}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false

  audit-service:
    build: ./Audit-Service
    container_name: ${AUDIT_NAME}
    ports:
      - "${AUDIT_SERVICE_PORT}:8087"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SPRING_APPLICATION_NAME=${AUDIT_NAME}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${AUDIT_DB}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_SERVER_URL}
      - EUREKA_INSTANCE_HOSTNAME=${AUDIT_NAME}
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false

volumes:
  postgres_data: